<title>Kashgar to Hanoi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first trip planner. Five views switched from a bottom tab bar (radio buttons, so it works without scripts):
   Today, Route (map + stop list, map opens full screen with a stop panel), Days, Book, Costs.
   Palette: loess paper, Hotan jade accent, cinnabar lacquer roads, Dong indigo rail, highland-barley walks. */
:root{
  --bg:#EDEAE2;        /* loess paper */
  --panel:#FFFEFB;
  --panel-2:#F6F3EC;
  --ink:#1C1E25;
  --ink-2:#464851;
  --muted:#6D6A66;
  --line:#DAD5CB;
  --line-strong:#BBB4A7;
  --accent:#17725E;    /* Hotan jade */
  --accent-ink:#FFFFFF;
  --accent-soft:#D5EAE2;
  --road:#B23A2A;      /* cinnabar lacquer: buses, vans, cars */
  --rail:#2A3D82;      /* Dong indigo: trains */
  --hike:#8A6610;      /* highland barley: on foot */
  --done:#A9A59D;
  --land:#E2DED4;
  --land-route:#F7F4EC;
  --land-stroke:#ADA595;
  --c-chn:#F7E2AE; --c-vnm:#D5E8CB; --c-kgz:#CFE3E1; --c-tjk:#DCDCD2; --c-kaz:#D8DCE3; --c-mng:#DCD9E2; --c-lao:#DDD6DF; --c-mmr:#D3DCD5;
  --c-ind:#DDD9D3; --c-pak:#D6DCD3; --c-npl:#D9CFDF; --c-btn:#D9DCCB; --c-bgd:#D0DADB; --c-afg:#DCDAE0; --c-tha:#D6DCD4;
  --grat:#D5CFC3;
  --mtn:#9C8458; --mtn-ink:#76603A; --water:#BCD6EA; --river:#6F9FC6; --river-ink:#3D6D95;
  --travel-soft:rgba(178,58,42,.06); --travel-bar:rgba(178,58,42,.45);
  --halo:#F7F4EC;
  --ok:#256F45;  --ok-soft:#DCEFE3;
  --warn:#8C5A00; --warn-soft:#F6E8C9;
  --crit:#A8231B; --crit-soft:#F8DDDA;
  --shadow:0 1px 2px rgba(28,30,37,.07), 0 6px 18px rgba(28,30,37,.07);
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --panel:#1A1C1F; --panel-2:#202226; --ink:#ECE8DF; --ink-2:#C3BEB3; --muted:#938E84;
    --line:#2D2F33; --line-strong:#44464C; --accent:#4CC4A5; --accent-ink:#05231C; --accent-soft:#123A30;
    --road:#EA7A60; --rail:#97A9F2; --hike:#D9B44C; --done:#5F5D59;
    --land:#16181B; --land-route:#24262A; --travel-soft:rgba(234,122,96,.08); --travel-bar:rgba(234,122,96,.5); --land-stroke:#55555A; --grat:#1E2023; --halo:#1A1C1F; --mtn:#B49C6E; --mtn-ink:#CDB78C; --water:#1F3A4E; --river:#4D7AA0; --river-ink:#8DB7DC;
    --c-chn:#3B311C; --c-vnm:#1F3221; --c-kgz:#17302D; --c-tjk:#212219; --c-kaz:#1D2128; --c-mng:#211F27; --c-lao:#241F26; --c-mmr:#1C231E;
    --c-ind:#23211E; --c-pak:#1D231C; --c-npl:#2A2131; --c-btn:#21231A; --c-bgd:#1A2223; --c-afg:#212026; --c-tha:#1D221C;
    --ok:#74D39C; --ok-soft:#14321F; --warn:#EDBB60; --warn-soft:#382B10; --crit:#F48A80; --crit-soft:#3B1916;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --panel:#1A1C1F; --panel-2:#202226; --ink:#ECE8DF; --ink-2:#C3BEB3; --muted:#938E84;
  --line:#2D2F33; --line-strong:#44464C; --accent:#4CC4A5; --accent-ink:#05231C; --accent-soft:#123A30;
  --road:#EA7A60; --rail:#97A9F2; --hike:#D9B44C; --done:#5F5D59;
  --land:#16181B; --land-route:#24262A; --travel-soft:rgba(234,122,96,.08); --travel-bar:rgba(234,122,96,.5); --land-stroke:#55555A; --grat:#1E2023; --halo:#1A1C1F; --mtn:#B49C6E; --mtn-ink:#CDB78C; --water:#1F3A4E; --river:#4D7AA0; --river-ink:#8DB7DC;
  --c-chn:#3B311C; --c-vnm:#1F3221; --c-kgz:#17302D; --c-tjk:#212219; --c-kaz:#1D2128; --c-mng:#211F27; --c-lao:#241F26; --c-mmr:#1C231E;
  --c-ind:#23211E; --c-pak:#1D231C; --c-npl:#2A2131; --c-btn:#21231A; --c-bgd:#1A2223; --c-afg:#212026; --c-tha:#1D221C;
  --ok:#74D39C; --ok-soft:#14321F; --warn:#EDBB60; --warn-soft:#382B10; --crit:#F48A80; --crit-soft:#3B1916;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px calc(92px + env(safe-area-inset-bottom, 0px))}
a{color:var(--accent);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
summary::-webkit-details-marker{display:none}
.chev{flex:none;justify-self:end;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);width:9px;height:9px;transform:rotate(45deg) translateY(-3px);transition:transform .15s}
details[open] > summary .chev{transform:rotate(225deg) translateX(-2px)}
.wrap:not(.nojs) .nojs-only{display:none!important}
.nojs .js-only{display:none!important}

/* views switch with radio buttons, so they work with or without scripts */
.vr,.msr{position:absolute;top:0;left:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.view{display:none;min-width:0}
#v-today:checked ~ .views #today,#v-route:checked ~ .views #route,#v-days:checked ~ .views #days,#v-book:checked ~ .views #book,#v-cost:checked ~ .views #cost{display:block}
.views{max-width:760px;margin:0 auto}
#v-route:checked ~ .views{max-width:none}
.vh{margin:6px 0 14px;font:800 28px/1.08 var(--f-display);letter-spacing:-.02em}
.vh small{display:block;margin-top:4px;font:500 12.5px/1.3 var(--f-mono);letter-spacing:0;color:var(--muted)}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(28,30,37,.07);padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.tabbar label{position:relative;display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:12px;font:700 11.5px/1 var(--f-body);color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#v-today:checked ~ .tabbar [for="v-today"],#v-route:checked ~ .tabbar [for="v-route"],#v-days:checked ~ .tabbar [for="v-days"],#v-book:checked ~ .tabbar [for="v-book"],#v-cost:checked ~ .tabbar [for="v-cost"]{color:var(--accent);background:var(--accent-soft)}
.tbadge{position:absolute;top:1px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:var(--panel);font:700 10.5px/18px var(--f-mono);text-align:center}
.tbadge:empty{display:none}
@media (min-width:760px){
  .tabbar{left:50%;right:auto;transform:translateX(-50%);width:min(540px, calc(100% - 32px));bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding:6px;border:1px solid var(--line);border-radius:18px}
}
.wrap:has(#ms-none:not(:checked)) .tabbar{display:none}
html:has(#ms-none:not(:checked)){overflow:hidden}
.wrap:has(#ms-none:not(:checked)) .views #route{display:block}

/* today */
.top{display:grid;gap:6px;margin:4px 0 14px}
.eyebrow{margin:0;font:500 11.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:800 clamp(32px,9vw,46px)/1 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
h1 .to{font-weight:600;color:var(--accent)}
.sub{margin:0;max-width:62ch;color:var(--ink-2)}
.prevleg{justify-self:start;font-size:13.5px;font-weight:700;text-decoration:none}
.prevleg:hover{text-decoration:underline}
.today{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.t-date{margin:0;font:600 11.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.t-title{margin:0;font:800 25px/1.1 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.t-sum{margin:0;color:var(--ink-2)}
.trow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding-top:11px;border-top:1px solid var(--line);min-width:0}
.trow .k{font:600 11px/1.6 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trow .v{display:grid;gap:4px;min-width:0}
.t-acts{display:flex;flex-wrap:wrap;gap:8px}
.asof{margin:0;font-size:12.5px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat{display:inline-flex;align-items:baseline;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13.5px;color:var(--ink-2)}
.stat b{font:600 15px/1 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.block{margin-top:22px}
.bh{margin:0 0 8px;font:600 11.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.booknext{display:grid;gap:8px}
.bn{display:grid;gap:3px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.bn.urgent{border-color:var(--crit)}
.bn b{font-weight:700}
.bn span{font:500 12.5px/1.4 var(--f-mono);color:var(--ink-2)}
.more{display:inline-flex;margin-top:10px;font-weight:700;color:var(--accent);cursor:pointer;font-size:14px}
details.about,details.note{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
details.about > summary,details.note > summary{display:flex;justify-content:space-between;align-items:center;font:600 11.5px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 0}
details.about p,details.note p{margin:10px 0 0;color:var(--ink-2);font-size:14px;max-width:65ch}

/* route: map + stop list */
.routegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.mapcol,.listcol{min-width:0}
@media (min-width:980px){
  .routegrid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start;gap:22px}
  .mapcol{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}
}
.mapwrap{position:relative}
.mapbox{position:relative;width:100%;max-width:100%;aspect-ratio:5/4;background:var(--land);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media (min-width:980px){.mapbox{aspect-ratio:4/3}}
.mapinner{position:relative;width:100%;max-width:100%}
.wrap:not(.nojs):not(.nod3) .mapinner{position:absolute;inset:0;width:auto}
.nojs .mapbox,.nod3 .mapbox{aspect-ratio:auto}
.nojs .mapinner,.nod3 .mapinner{aspect-ratio:var(--ar, 5/4)}
#map{display:block;width:100%;height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.nojs #map,.nod3 #map{position:absolute;inset:0}
.wrap:not(.nojs) #ms-none:checked ~ .mapbox #map{touch-action:pan-x pan-y!important;cursor:zoom-in}
.mklabels{position:absolute;inset:0}
.wrap:not(.nojs):not(.nod3) .mklabels{display:none}
.mklabels label{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mbtn{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font:700 13.5px/1 var(--f-body);cursor:pointer;-webkit-tap-highlight-color:transparent}
.mbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.openmap{position:absolute;right:8px;bottom:8px}
.mapclose{display:none;position:absolute;left:calc(10px + env(safe-area-inset-left, 0px));top:calc(10px + env(safe-area-inset-top, 0px))}
.zoom{display:none;position:absolute;left:calc(10px + env(safe-area-inset-left, 0px));top:calc(60px + env(safe-area-inset-top, 0px));flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);padding:0}
.zoom button:hover{border-color:var(--accent);color:var(--accent)}
.zoom svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mapnote{position:absolute;left:8px;top:8px;max-width:calc(100% - 70px);padding:5px 9px;font-size:12px;line-height:1.35;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.mapnote .retry{margin-left:4px;padding:2px 8px;font:inherit;font-weight:600;color:var(--accent);background:none;border:1px solid var(--line-strong);border-radius:5px;cursor:pointer}
.nojs .zoom,.nojs .mapnote{display:none!important}
.jserr{margin:0 0 12px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.4}

/* full-screen map: any map radio other than "closed" */
#ms-none:not(:checked) ~ .mapbox{position:fixed;inset:0;z-index:60;width:auto;aspect-ratio:auto;border:0;border-radius:0}
#ms-none:not(:checked) ~ .mapbox .openmap{display:none}
#ms-none:not(:checked) ~ .mapbox .mapnote{left:calc(120px + env(safe-area-inset-left, 0px));top:calc(10px + env(safe-area-inset-top, 0px));max-width:calc(100% - 136px)}
#ms-none:not(:checked) ~ .mapbox .mapclose{display:inline-flex}
.wrap:not(.nojs) #ms-none:not(:checked) ~ .mapbox .zoom{display:flex}
.wrap:not(.nojs) #ms-none:not(:checked) ~ .mapbox #map{touch-action:none!important;cursor:grab}
.nojs #ms-none:not(:checked) ~ .mapbox,.nod3 #ms-none:not(:checked) ~ .mapbox{display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top, 0px) + 58px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px)}
.nojs #ms-none:not(:checked) ~ .mapbox .mapinner,.nod3 #ms-none:not(:checked) ~ .mapbox .mapinner{width:min(100%, calc((100vh - 64px) * var(--arn, 1.25)));width:min(100%, calc((100dvh - 64px) * var(--arn, 1.25)))}
@media (orientation:landscape){
  .nojs #ms-none:not(:checked) ~ .mapbox,.nod3 #ms-none:not(:checked) ~ .mapbox{justify-content:flex-start;padding:env(safe-area-inset-top, 0px) 0 0 env(safe-area-inset-left, 0px)}
  .nojs #ms-none:not(:checked) ~ .mapbox .mapinner,.nod3 #ms-none:not(:checked) ~ .mapbox .mapinner{width:min(calc(100% - min(390px, 46vw)), calc(100vh * var(--arn, 1.25)));width:min(calc(100% - min(390px, 46vw)), calc(100dvh * var(--arn, 1.25)))}
}
.mapkey{display:none}
#ms-none:not(:checked) ~ .mapbox .mapkey{display:block;position:absolute;left:calc(10px + env(safe-area-inset-left, 0px));top:calc(60px + env(safe-area-inset-top, 0px));max-width:calc(100% - 20px);z-index:2}
.wrap:not(.nojs):not(.nod3) #ms-none:not(:checked) ~ .mapbox .mapkey{top:calc(214px + env(safe-area-inset-top, 0px))}
.mapkey summary{display:inline-flex}
.mapkey .legend{margin:8px 0 0;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}

/* stop panel: bottom sheet in portrait, side panel in landscape */
.pops{display:none}
#ms-none:not(:checked) ~ .pops{display:block;position:fixed;z-index:61;left:0;right:0;bottom:0;pointer-events:none}
.pop{display:none;pointer-events:auto;background:var(--panel);color:var(--ink);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-height:56vh;max-height:56dvh;border-radius:18px 18px 0 0;border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.2);padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.pop::before{content:"";display:block;width:38px;height:4px;margin:0 auto 8px;border-radius:2px;background:var(--line-strong)}
@media (orientation:landscape),(min-width:900px){
  #ms-none:not(:checked) ~ .pops{left:auto;top:0;width:min(390px, 46vw)}
  .pop{height:100%;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.2);padding:calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) 16px}
  .pop::before{display:none}
}
.pop-bar{display:flex;align-items:center;gap:6px;min-width:0}
.pnav{display:inline-flex;align-items:center;min-height:36px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;max-width:40%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;-webkit-tap-highlight-color:transparent}
.pnav.off{opacity:.35;cursor:default}
.pclose{margin-left:auto;flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);cursor:pointer;font:400 22px/1 var(--f-body);color:var(--ink-2)}
.pphoto{margin-left:auto;flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.pphoto + .pclose{margin-left:0}
.pphoto:hover{border-color:var(--accent);color:var(--accent)}
.pphoto svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pphoto .seal{fill:var(--road);stroke:none}
.pop-bar{margin-bottom:12px}
.p-zh{margin-left:6px;font:700 18px/1 var(--f-body);color:var(--accent);letter-spacing:.04em}
.p-title{margin:0;font:800 23px/1.1 var(--f-display);letter-spacing:-.015em}
.p-title a{color:inherit;text-decoration:none}
.p-meta{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.pop .blurb{margin:10px 0 0;font-size:14.5px}
.pop .plan{margin-top:12px}
.pop .plan li{grid-template-columns:74px minmax(0,1fr);font-size:14px}
.pinfo{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;display:grid;gap:3px}
.pinfo .k{font:600 11px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pop .links{margin-top:12px}
.pop .full{margin-top:12px;width:100%;justify-content:center}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
